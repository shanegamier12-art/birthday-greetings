<!DOCTYPE html>
<html>
<head>
<title>Cute Birthday Cake</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
    background: linear-gradient(135deg, #d9f2ff, #b3e5ff, #e6f7ff);
}

/* FLOATING ORBS */
.orb {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    animation: float 12s linear infinite;
    filter: blur(2px);
}

@keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}

/* CARD */
.card {
    text-align: center;
    padding: 8vw;
    width: 85vw;
    max-width: 420px;
    border-radius: 25px;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(15px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    animation: fadeIn 1.5s ease;
    position: relative;
    z-index: 2;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

h2 {
    color: #2b8bbd;
    font-size: 6.5vw;
    text-shadow: 0 0 12px rgba(79,195,247,0.5);
}

p {
    color: #555;
    font-size: 4.2vw;
}

p span {
    font-size: 3.5vw;
}

.cake-img {
    width: 55vw;
    max-width: 260px;
    margin-top: 20px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    cursor: pointer;
    transition: transform 0.2s;
}

.cake-img:active {
    transform: scale(0.95);
}

.next-btn {
    margin-top: 20px;
    padding: 14px 22px;
    border: none;
    border-radius: 20px;
    background: #4cc9f0;
    color: white;
    font-size: 4.5vw;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    transition: 0.2s;
}

.next-btn:hover {
    background: #2b8bbd;
    transform: scale(1.05);
}

/* CONFETTI */
.confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -10px;
    opacity: 0.9;
    z-index: 9999;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

/* ORB SIZES */
.orb:nth-child(1){ width:12vw; height:12vw; left:10%; }
.orb:nth-child(2){ width:8vw; height:8vw; left:25%; }
.orb:nth-child(3){ width:15vw; height:15vw; left:70%; }

/* DESKTOP FIX */
@media (min-width: 768px) {
    h2 { font-size: 28px; }
    p { font-size: 16px; }
    p span { font-size: 13px; }
    .cake-img { width: 240px; }
    .next-btn { font-size: 16px; }
}
</style>
</head>

<body>

<!-- 🎵 MUSIC -->
<audio id="bgm" loop>
    <source src="hbday.mp3" type="audio/mpeg">
</audio>

<!-- FLOATING ORBS -->
<div class="orb" style="animation-duration:14s;"></div>
<div class="orb" style="animation-duration:10s;"></div>
<div class="orb" style="animation-duration:16s;"></div>

<!-- CARD -->
<div class="card">

    <h2 id="title">🎂 Happy Birthday 🎉</h2>

    <p id="instruction">
        Make a wish first ✨<br>
        and click the cake 🎂<br><br>
    </p>

    <!-- CAKE -->
    <img src="cake.png" class="cake-img" onclick="celebrate()">

    <!-- NEXT BUTTON -->
    <br>
    <button class="next-btn" onclick="goNext()">Next 💌</button>

</div>

<script>
let name = localStorage.getItem("name");
document.getElementById("title").innerText =
"Happy Birthday Love, " + name + " 🎉";

const bgm = document.getElementById("bgm");

/* PLAY FROM 12 SECONDS */
function playMusic() {
    bgm.currentTime = 12;
    bgm.play();
}

/* MOBILE AUTOPLAY FIX (tap once) */
window.addEventListener("click", playMusic, { once: true });

/* LOOP FROM 12s INSTEAD OF 0 */
bgm.addEventListener("ended", () => {
    bgm.currentTime = 12;
    bgm.play();
});

/* CONFETTI */
function celebrate() {
    for (let i = 0; i < 40; i++) {
        let confetti = document.createElement("div");
        confetti.classList.add("confetti");

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.background = randomColor();
        confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        }, 4000);
    }
}

/* COLORS */
function randomColor() {
    const colors = ["#ff4d6d", "#ffd166", "#06d6a0", "#4cc9f0", "#b5179e"];
    return colors[Math.floor(Math.random() * colors.length)];
}

/* NEXT PAGE */
function goNext() {
    window.location.href = "card.html";
}
</script>

</body>
</html>
