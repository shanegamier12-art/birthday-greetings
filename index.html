<!DOCTYPE html>
<html>
<head>
<title>Birthday Entry</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Arial", sans-serif;
    background: linear-gradient(135deg, #d9f2ff, #b3e5ff, #e6f7ff);
    overflow: hidden;
}

/* FLOATING BACKGROUND SHAPES */
.circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    animation: float 10s infinite linear;
}

@keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}

/* CARD */
.box {
    position: relative;
    text-align: center;
    padding: 6vw;
    width: 85vw; /* responsive width */
    max-width: 400px;
    border-radius: 25px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    animation: fadeIn 1.5s ease;
}

/* FADE IN */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* TITLE */
h2 {
    color: #2b8bbd;
    font-size: 6vw; /* bigger on mobile */
    margin-bottom: 10px;
}

/* INPUT */
input {
    width: 90%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #b3e5ff;
    outline: none;
    margin-top: 15px;
    text-align: center;
    font-size: 4vw;
}

/* BUTTON */
button {
    margin-top: 20px;
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #4fc3f7, #29b6f6);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    font-size: 4.5vw;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(41,182,246,0.4);
}

/* TEXT */
p {
    font-size: 4vw;
    color: #555;
    margin-top: 10px;
}

/* DESKTOP FIX (so it doesn't get TOO big) */
@media (min-width: 768px) {
    h2 { font-size: 28px; }
    p { font-size: 16px; }
    input { font-size: 16px; }
    button { font-size: 16px; }
}
</style>
</head>

<body>

<!-- FLOATING CIRCLES -->
<div class="circle" style="width:10vw;height:10vw;left:10%;animation-duration:12s;"></div>
<div class="circle" style="width:8vw;height:8vw;left:30%;animation-duration:8s;"></div>
<div class="circle" style="width:12vw;height:12vw;left:70%;animation-duration:14s;"></div>
<div class="circle" style="width:6vw;height:6vw;left:85%;animation-duration:10s;"></div>

<!-- CARD -->
<div class="box">
    <h2>💙 HBD 💙</h2>
    <p>Enter your name to begin the surprise ✨</p>

    <input type="text" id="name" placeholder="Your name here...">
    <br>
    <button onclick="go()">Start</button>
</div>

<script>
function go(){
    let name = document.getElementById("name").value;
    if(name.trim() !== ""){
        localStorage.setItem("name", name);
        window.location.href = "greeting.html";
    } else {
        alert("Please enter your name");
    }
}
</script>

</body>
</html>
