<!DOCTYPE html>
<html>
<head>
<title>Birthday Greeting</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: "Arial", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #d9f2ff, #b3e5ff, #e6f7ff);
    overflow: hidden;
}

/* FLOATING BACKGROUND ELEMENTS */
.circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    animation: float 12s infinite linear;
    filter: blur(1px);
}

@keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}

/* MAIN CARD */
.card {
    position: relative;
    text-align: center;
    padding: 8vw;
    width: 85vw; /* responsive */
    max-width: 420px;
    border-radius: 25px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(15px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.1);
    animation: fadeIn 1.5s ease;
}

/* FADE IN */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* TITLE */
h1 {
    font-size: 6.5vw; /* BIG on mobile */
    color: #2b8bbd;
    margin-bottom: 10px;
    animation: glow 2s infinite alternate;
}

/* GLOW EFFECT */
@keyframes glow {
    from { text-shadow: 0 0 5px #4fc3f7; }
    to { text-shadow: 0 0 18px #29b6f6; }
}

/* SUBTEXT */
p {
    color: #555;
    font-size: 4.2vw;
    margin-bottom: 25px;
}

/* BUTTON */
button {
    padding: 14px 22px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, #4fc3f7, #29b6f6);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    font-size: 4.5vw;
}

button:hover {
    transform: scale(1.08);
    box-shadow: 0 10px 20px rgba(41,182,246,0.4);
}

/* HEART */
.heart {
    font-size: 6vw;
    color: #4fc3f7;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
}

/* FLOATING SIZES (responsive) */
.circle:nth-child(1) { width:12vw; height:12vw; left:10%; }
.circle:nth-child(2) { width:8vw; height:8vw; left:25%; }
.circle:nth-child(3) { width:15vw; height:15vw; left:70%; }
.circle:nth-child(4) { width:7vw; height:7vw; left:85%; }

/* DESKTOP LIMIT */
@media (min-width: 768px) {
    h1 { font-size: 28px; }
    p { font-size: 16px; }
    button { font-size: 16px; }
    .heart { font-size: 26px; }
}
</style>
</head>

<body>

<!-- FLOATING BACKGROUND -->
<div class="circle" style="animation-duration:14s;"></div>
<div class="circle" style="animation-duration:10s;"></div>
<div class="circle" style="animation-duration:16s;"></div>
<div class="circle" style="animation-duration:12s;"></div>

<!-- CARD -->
<div class="card">

    <div class="heart">💙✨</div>

    <h1 id="greet"></h1>

    <p>May your day be filled with happiness, love, and magical moments ✨</p>

    <button onclick="next()">Continue 🎂</button>
</div>

<script>
let name = localStorage.getItem("name");

document.getElementById("greet").innerText =
"Happy Birthday Love, " + name + " 🎉";

function next(){
    window.location.href = "cake.html";
}
</script>

</body>
</html>
