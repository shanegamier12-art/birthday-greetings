<!DOCTYPE html>
<html>
<head>
<title>Hi Love</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;

    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #cfefff, #e6f7ff, #b3e5ff);

    overflow-x: hidden;
    overflow-y: auto;
    padding: 20px;
}

/* floating circles */
.circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    box-shadow: 0 0 20px rgba(255,255,255,0.6);
    animation: float 12s linear infinite;
    z-index: 0;
}

@keyframes float {
    from {
        transform: translateY(100vh) scale(0.6);
        opacity: 0;
    }
    50% {
        opacity: 1;
    }
    to {
        transform: translateY(-20vh) scale(1.2);
        opacity: 0;
    }
}

/* card */
.card {
    position: relative;
    width: 90%;
    max-width: 360px;
    padding: 25px;
    text-align: center;

    background: rgba(255, 255, 255, 0.25);
    border-radius: 20px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    border: 1px solid rgba(255,255,255,0.3);

    color: #2c3e50;
    z-index: 2;

    margin: 20px 0;
}

.card h2 {
    margin-bottom: 10px;
}

.card img {
    width: 100%;
    border-radius: 12px;
    margin: 10px 0;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.card p {
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-line;
}

/* blinking cursor */
.cursor {
    display: inline-block;
    width: 2px;
    background: #2c3e50;
    margin-left: 2px;
    animation: blink 0.7s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}
</style>
</head>

<body>

<!-- 🎵 Background Music -->
<audio id="bgm" autoplay loop>
    <source src="lover.mp3" type="audio/mpeg">
</audio>

<div class="card">
    <h2> Hi Love 💙</h2>
    <img src="love.jpg" alt="memory">
    <p id="msg"></p><span class="cursor"></span>
</div>

<script>
// floating circles
for(let i = 0; i < 20; i++){
    let c = document.createElement("div");
    c.className = "circle";

    let size = Math.random() * 80 + 20;
    c.style.width = size + "px";
    c.style.height = size + "px";

    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDuration = (Math.random() * 6 + 6) + "s";
    c.style.animationDelay = Math.random() * 5 + "s";

    document.body.appendChild(c);
}

// get name
let name = localStorage.getItem("name") || "My Love";

// full message
let text =
`Happy Birthday ${name}! 💙

You are the most beautiful part of my life.
No matter what happens, I’ll always choose you.
You make ordinary days feel special just by being in them.

I’m grateful for every smile, every talk, and every moment with you.
You are loved more than words can explain. 💖

Even though we’re in a long-distance relationship and we don’t talk as much as we used to, I want you to know that I’m still here—quietly, consistently, and always for you.

Time and distance never changed how I feel. If anything, it made me realize even more how special you are to me.

I may not always be as present in words or conversations, but I am always present in heart. I’m still grateful for you, for us, and for every moment we’ve shared—even the simplest ones.

I hope you always stay happy, even when I’m not around.
You will always have a special place in my heart.

You will always have me as your number one supporter. I will always be proud of you, and I will always be cheering for your dreams, no matter where life takes us.

Ikaw lang palagi, mahal ko.
Mananatiling ikaw hanggang dulo.

I love you so much, love!`;

// typing animation
let i = 0;
function typeWriter() {
    if (i < text.length) {
        document.getElementById("msg").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 35);
    }
}
typeWriter();

// autoplay music fix (mobile browsers need interaction sometimes)
window.addEventListener("click", () => {
    document.getElementById("bgm").play();
});
</script>

</body>
</html>
